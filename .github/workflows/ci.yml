name: CI

# Ponto de entrada único para pushes e pull requests. O job `changes` mapeia o
# diff para os checks afetados e pula o resto. O job final `CI` é o único status
# obrigatório, então um check pulado nunca deixa o merge pendente. Markdown da
# raiz, changelogs, licença, imagens, snippets, gramáticas e traduções não
# disparam nada além deste gate: nenhum check do CI os lê.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.filter.outputs.node }}
      docs: ${{ steps.filter.outputs.docs }}
      codeql: ${{ steps.filter.outputs.codeql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Map changed paths to checks
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all=false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE...$HEAD")
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            files=$(git diff --name-only "$BEFORE" "$SHA")
          else
            all=true
            files=''
          fi
          printf 'Changed files:\n%s\n' "${files:-(full run)}"
          # O ci.yml decide o que roda: se ele muda, roda tudo. Cada workflow
          # reutilizável liga só o próprio check (veja os padrões abaixo), e
          # qualquer workflow liga o CodeQL, que também analisa os Actions.
          if grep -qE '^\.github/workflows/ci\.yml$' <<< "$files"; then all=true; fi
          match() {
            if [ "$all" = true ] || grep -qE "$1" <<< "$files"; then echo true; else echo false; fi
          }
          node=$(match '(^(src/|scripts/|package(-lock)?\.json$|tsconfig[^/]*\.json$)|^\.github/workflows/node\.yml$)')
          workflows=$(match '^\.github/(workflows/|codeql/)')
          {
            echo "node=$node"
            echo "docs=$(match '(^(docs/|zensical\.toml$|requirements-docs\.txt$)|^\.github/workflows/docs\.yml$)')"
            if [ "$node" = true ] || [ "$workflows" = true ] || [ "$all" = true ]; then echo codeql=true; else echo codeql=false; fi
          } | tee -a "$GITHUB_OUTPUT"

  node:
    name: Extension
    needs: changes
    if: needs.changes.outputs.node == 'true'
    uses: ./.github/workflows/node.yml

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  codeql:
    name: CodeQL
    needs: changes
    if: needs.changes.outputs.codeql == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  result:
    name: CI
    needs: [changes, node, docs, codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo '::error::A selected check failed or was cancelled.'
            exit 1
          fi
