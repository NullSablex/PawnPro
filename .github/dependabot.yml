version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # `@types/vscode` acompanha o `engines.vscode` e só sobe junto com ele, à
    # mão: tipos mais novos que o `engines` fazem o `vsce package` recusar e
    # liberam APIs que a versão mínima prometida não tem.
    ignore:
      - dependency-name: "@types/vscode"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
